# Run the CDC merge-on-read benchmark ON THE CLUSTER for one config (spark|vector) over one table
# (a variant in the S3 warehouse generated by iceberg-mor-gen.yaml). The change batch is written to
# an S3 prefix under --out (executors read it); the per-config JSONL is written to the driver's local
# disk and copied to S3 by run-iceberg-mor.sh after the driver completes. Rendered by run-iceberg-mor.sh.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-vector-mor-cdc-CONFIG-TABLE
  namespace: bench
spec:
  type: Scala
  mode: cluster
  image: IMAGE
  imagePullPolicy: IfNotPresent
  mainClass: io.sparkvector.benchmarks.CdcMergeRunner
  mainApplicationFile: local:///opt/spark/jars/benchmarks.jar
  arguments:
    - "--config"
    - "CONFIG"                                   # spark or vector
    - "--iceberg"
    - "s3a://S3_BUCKET/iceberg-mor/NAMESPACE"     # the generated warehouse
    - "--table"
    - "TABLE"                                     # e.g. v2.pos_10 or v3.dv_10
    - "--base-table"
    - "BASE_TABLE"
    - "--out"
    - "s3a://S3_BUCKET/results/iceberg-mor-cdc"   # change batch + (uploaded) results prefix
    - "--iterations"
    - "3"
    - "--warmup"
    - "1"
    - "--read-iterations"
    - "5"
    - "--read-warmup"
    - "2"
    - "--shuffle-partitions"
    - "300"
    - "--change-pct"
    - "CHANGE_PCT"                                # % of rows in the change batch, or "default"
  sparkVersion: "4.1.3"
  sparkConf:
    # No spark.sql.adaptive.coalescePartitions.minPartitionNum (deprecated since Spark 3.2; it was
    # 208 here, #20). AQE coalescing uses its defaults: with parallelismFirst (true) the minimum
    # partition count is the cluster's default parallelism, and minPartitionSize (1 MB) bounds the
    # target size from below. The write's advisory partition size is only honoured as the upper
    # bound; set parallelismFirst=false to coalesce to it.
    spark.sql.adaptive.enabled: "true"
    spark.hadoop.fs.s3a.connection.maximum: "200"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    spark.driver.extraJavaOptions: >-
      --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
      --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
      -XX:MaxDirectMemorySize=18g
    spark.executor.extraJavaOptions: >-
      --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
      --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
      -XX:MaxDirectMemorySize=18g
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "3g"
    serviceAccount: sfi-engine
    nodeSelector:
      workload: "spark-xl"
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  executor:
    instances: 8
    cores: 14
    memory: "28g"
    memoryOverhead: "24g"
    serviceAccount: sfi-engine
    nodeSelector:
      workload: "spark-xl"
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
