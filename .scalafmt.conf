# Formatting of the Scala sources (#423), run by Spotless: `mvn spotless:apply` formats, `mvn spotless:check`
# (bound to `verify`) fails the build on an unformatted file. 120 columns; no vertical alignment; comments and
# docstrings are left as written. (Java is formatted by Netflix's jfmt, configured in the root pom.)
version = 3.9.4
runner.dialect = scala213
maxColumn = 120
align.preset = none
docstrings.wrap = no
docstrings.style = keep
comments.wrap = no
newlines.source = keep
rewrite.trailingCommas.style = keep
