# Builds the static site in web/ (no Jekyll) and publishes it to GitHub Pages under /spark-vector/.
# Needs Settings -> Pages -> Source = "GitHub Actions" (replacing the Jekyll build from main:/docs).
# Not a gate: it runs on pushes to main that touch the site's sources, and by hand.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "benchmarks/scripts/render-*.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one but never cancels one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        run: cd web && npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
